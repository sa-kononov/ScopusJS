<!DOCTYPE html>
<html lang="RU">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Scopus Search Front-End Tool with JS">
    <meta name="author" content="Sergey Kononov">
    <title>Scopus Search Front-End</title>

    <!-- CSS -->
    <style>
        
        :root {
            --theme-color: rgb(81, 127, 218);
            --error-color: crimson;
            font: medium sans-serif;
        }
        
        .input-div {
            margin: 5px 20px 20px;
            display: flex;
            justify-content: left;
            align-items: center;
        }
        
        .input-label {
            margin-left: 20px;
        }
        
        .result-div {
            margin: 20px 20px;
            display: flex;
            justify-content: left;
            align-items: center;
            font-weight: bold;
        }
        
        .input {
            width: 500px;
            padding: 5px 10px;
            border: 3px solid var(--theme-color);
            font: large monospace;
            outline-color: var(--theme-color);
        }
        
        .reset-button {
            background-color: white;
            border: 2px solid;
            outline: none;
            width: 26px;
            height: 26px;
            border-radius: 13px;
            font: bold 18px sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
        }
        .reset-button:hover {
            color: white;
            background-color: var(--element-color);
        }
        
        .clear-button {
            --element-color: #aaa;
            color: var(--element-color);
            border-color: var(--element-color);
        }
        
        #search-button {
            font-size: larger;
            position: relative;
            text-align: center;
            padding: 10px;
            border: 3px solid var(--theme-color);
            background: white;
            color: var(--theme-color);
            font-weight: bold;
            outline: none;
            width: 200px;
            cursor: pointer;
        }
        #search-button:hover {
            background-color: var(--theme-color);
            color: white;
        }
        #search-button:disabled {
            color: grey;
            border-color: grey;
            background-color: white;
            cursor: progress;
        }
        
        progress {
            margin-left: 5px;
        }
        
        .stop-button {
            --element-color: red;
            color: var(--element-color);
            border-color: var(--element-color);
        }
        
        .error {
            color: var(--error-color);
        }
        
        th {
            position: sticky;
            top: 0;
        }
        
        td {
            padding: 3px;
        }
        #restable {
            font-size: small;
            margin: 20px 20px;
            width: 90%;
            max-width: 1500px;
            min-width: 600px;
            border-color: var(--theme-color);
        }
        #restable th {
            font-weight: bold;
            background-color: var(--theme-color);
            color: white;
        }
        #restable tr:nth-child(even) {
            background-color: rgb(234, 238, 246);
        }
        #restable td.right {
            text-align: right;
        }
        td p {
            margin: 3px 0;
        }
    </style>
    <!-- Scopus client code -->
    <script>
        const identifiers = {'EID': ['eid', undefined], 'DOI': ['prism:doi', 'https://doi.org/'], 'PMID': ['pubmed-id', 'https://pubmed.ncbi.nlm.nih.gov/']};
        const apikeyrx = /^[a-zA-Z0-9]{32}$/;
        const defcount = 25; // count per repetative request
        const delay = 250;   // delay between requests [ms]
        const serialUrl = 'https://api.elsevier.com/content/serial/title'; //serial base URL
        const journalMaxLoadTries = 3;  // max number of tries to load jounal metadata
        
        var resTable;
        var searchRequests;        // array of search request objects
        var ntotal;                // number of found documents
        var nloaded = 0;           // counter of loaded documents
        var offset = 0;            // current offset in search results
        var canceled = false;      // canceled flag
        var stopped = false;       // stopped flag
        var searchInterval;        // search interval object
        var journalInterval;       // serial interval object
        var showJustNumber = false;    // just finding the number of publications
        var headers;               // HTTP headers for Scopus API
        var journalMap;            // journal metadata map {issn: metadata_entry}
        var journalLoadTries;      // journal load tries table {issn: ntries}
        var journalMetricYear;     // year of journal metrics to look up
        
        const errors = {'invalidQuery': 'Недействительное условие поиска!',
                        'jsonParseError': 'Не могу разобрать JSON-ответ! Результат неполный.',
                        'loadError': 'Ошибка загрузки! Результат неполный.',
                        'timeout': 'Время ожидания ответа истекло! Результат неполный.',
                        'aborted': 'Загрузка прервана!'
                       }; // predefined error messages
        
        function sendSearchRequest(search_url, headers, count) {
            if (searchInterval && (ntotal > 0 && offset >= ntotal || stopped)) {
                clearInterval(searchInterval);
                searchInterval = undefined;
                return;
            }
        
            let req = new XMLHttpRequest();
        
            req.onload = (evt) => {
                const res = req.response;
                if (req.status == 200) {
                    if (!res || typeof res != 'object' || !('search-results' in res))
                        processError('jsonParseError');
                    else {
                        displaySearchResult(res['search-results']);
                        if (!searchInterval && ntotal > count && !showJustNumber) {
                            searchInterval = setInterval(() => sendSearchRequest(search_url, headers, defcount), delay);
                        }
                    }
                } else {
                    processError('Ошибка HTTP ' + req.status + ': ' + req.statusText +
                                 ((typeof res == 'object' && 'service-error' in res) ? '\n' + 'STATUS ' + res['service-error'].status.statusCode + ': ' + res['service-error'].status.statusText : ''));
                }
                deleteSearchRequest(req);
            };
            req.onerror = (evt) => { processError('loadError'); }
            req.ontimeout = (evt) => { processError('timeout'); }
            req.onabort = (evt) => { processError('aborted'); }
            req.onloadend = (evt) => { deleteSearchRequest(req); }
        
            let url = search_url + '&count=' + count + '&start=' + offset;
            req.open('GET', url, true);
            for (let key in headers) req.setRequestHeader(key, headers[key]);
            req.responseType = 'json';
            req.send();
            offset += count;
        
            searchRequests.push(req);
        }
        
        function updateProgress() {
            let progressElm = document.getElementById('progress');
            if (ntotal === undefined && !stopped)
                progressElm.innerHTML = '<label>Идет поиск в Scopus...</label>';
            else if (ntotal >= 0)
                progressElm.innerHTML = `<label for="loading">Загружено ${nloaded} документов из Scopus</label>`;
            else
                progressElm.innerHTML = ''
            if (!stopped) {
                progressElm.innerHTML += `<input type="button" class="reset-button stop-button" value="&times;" onclick="cancelProgress()">`
                if (ntotal > 0)
                    progressElm.innerHTML += `<progress id="loading" value="${nloaded}" max="${ntotal}">`;
            }
        }
        
        function cancelProgress() {
            for (let i in searchRequests)
                if (searchRequests[i])
                    searchRequests[i].abort();
            stopped = true;
            canceled = true;
            //processError('aborted')
            updateProgress();
        }
        
        function deleteSearchRequest(req) {
            let nreqs = 0;
            for (let i in searchRequests) {
                if (searchRequests[i]) {
                    if (searchRequests[i] === req)
                        delete searchRequests[i];
                    else
                        nreqs++;
                }
            }
            if (nreqs == 0 && !searchInterval || ntotal > 0 && nloaded >= ntotal)
                stopped = true;
            updateProgress();
        }
        
        function processError(e) {
            let msg = (e in errors ? errors[e] : e);
            document.getElementById('result').innerHTML = '<span class="error">' + msg.replace(/\n/g, '<br />') + '</span>';
            console.error(msg);
            document.getElementById('search-button').disabled = false;
            if (e == 'timeout' && ntotal === undefined) {
                stopped = true;
                updateProgress();
            }
        }
        
        function displaySearchResult(res) {
            let thistotal = parseInt(res['opensearch:totalResults']);
        
            if (ntotal !== undefined) {
                if (ntotal != thistotal)
                    console.error('totalResults =', thistotal, 'в ответе отличается от начального', ntotal); 
            } else {
                ntotal = thistotal;    
                let msg = `Найдено ${ntotal} документов в Scopus`;
                document.getElementById('result').innerHTML = msg;
                console.log(`=== Found ${ntotal} results in Scopus ===`);
            }
        
            if (ntotal > 0 && !showJustNumber)
                displaySearchResultTable(res);
        
            document.getElementById('search-button').disabled = false;
        }
        
        function displaySearchResultTable(res) {
            const header = '\n<thead>' +
                           '<tr class="header">' +
                           '<th>Identifiers</th>' +
                           '<th>First author</th>' +
                           '<th>Countries</th>' +
                           '<th>Document title</th><th>Cover date</th><th>Type</th>' +
                           '<th>Cited by</th>' +
                           '<th>Source title</th><th>Volume</th><th>Issue</th><th>Pages / Art.num.</th>' +
                           '<th>ISSN</th><th>E-ISSN</th>' +
                           '<th>CiteScore<br/><ins class="metric-year"/></th>' +
                           '<th>SNIP<br/><ins class="metric-year"/></th><th>SJR<br/><ins class="metric-year"/></th></tr>' +
                           '</thead>\n';
        
            let tabcontent;
            if (resTable.innerHTML != '')
                tabcontent = resTable.innerHTML;
            else
                tabcontent = header;
        
            for (let i in res.entry) {
                let entry = res.entry[i];
                let scpid = entry['dc:identifier'].slice(10);
                let issn = 'prism:issn' in entry ? entry['prism:issn'] : ('prism:eIssn' in entry ? entry['prism:eIssn'] : '')
                let scpref;
                entry.link.forEach((lnk) => {
                    if (lnk['@ref'] == "scopus") scpref = lnk['@href'];
                });
                let countries = new Set();
                entry.affiliation.forEach((aff) => { countries.add(aff['affiliation-country']); });
                let affilcountries = Array.from(countries).join(', ');
                tabcontent += `<tr class="entry" id="scpid${scpid}" data-issn="${issn}">\n`;
                tabcontent += `<td style="width:12%"><p>SCPID: ${scpid}</p>`;
                for (let key in identifiers) {
                    let field = identifiers[key][0];
                    if (key == 'EID')
                        tabcontent += `<p>EID: <a href="${scpref}" target="_blank">` + entry.eid + '</a></p>';
                    else if (field in entry) {
                        tabcontent += `<p>${key}: <a href="${identifiers[key][1] + entry[field]}" target="_blank">` + entry[field] + '</a></p>';
                    }
                }
                tabcontent += '</td>\n' +
                              '<td>' + ('dc:creator' in entry ? entry['dc:creator'] : '') + '</td>\n' +
                              '<td>' + affilcountries + '</td>\n' +
                              '<td style="width:20%">' + entry['dc:title'] + '</td>\n' +
                              '<td class="right" style="width:70px">' + entry['prism:coverDate'] + '</td>\n' +
                              '<td>' + entry['subtypeDescription'] + '</td>\n' +
                              '<td class="right">' + entry['citedby-count'] + '</td>\n' +
                              '<td style="width:15%">' + entry['prism:publicationName'] + '</td>\n' +
                              '<td class="right">' + ('prism:volume' in entry ? entry['prism:volume'] : '') + '</td>\n' +
                              '<td class="right">' + ('prism:issueIdentifier' in entry ? entry['prism:issueIdentifier'] : '') + '</td>\n' +
                              '<td class="right">' + ('prism:pageRange' in entry && entry['prism:pageRange'] != null ? entry['prism:pageRange'] : ('article-number' in entry ? entry['article-number'] : '')) + '</td>\n' +
                              '<td class="right">' + ('prism:issn' in entry ? entry['prism:issn'] : '') + '</td>\n' + 
                              '<td class="right">' + ('prism:eIssn' in entry ? entry['prism:eIssn'] : '') + '</td>\n' + 
                              '<td class="citescore"></td><td class="snip"></td><td class="sjr"></td>\n</tr>\n';
            }
        
            resTable.innerHTML = '<tbody>\n' + tabcontent + '</tbody>\n';
        
            nloaded = tabcontent.match(/\<tr/g).length - 1;
        
            console.log(`${nloaded} our of ${ntotal} results loaded`);
        
            return nloaded;
        }
        
        function fillJournalMetricsYear(year) {
            journalMetricYear = year;
            for (let elm of document.getElementsByClassName('metric-year')) {
                elm.innerHTML = year;
            }
        }
        
        // Calls to serial title API
        function loadJournalMetrics() {
            const entriesLeft = resTable.querySelectorAll('tr.entry:not([data-journal-requested])');
            if (entriesLeft !== null && entriesLeft.length > 0 && !canceled) {
                const issns = Array.from(entriesLeft).filter((entry) => {
                    let issn = entry.getAttribute('data-issn');
                    if (issn != '' && !(issn in journalMap)) {
                        return true;
                    } else {
                        entry.toggleAttribute('data-journal-requested', true);
                        return false;    
                    }
                })
                .slice(0, 25)
                .map((entry) => {
                    entry.toggleAttribute('data-journal-requested', true);
                    return entry.getAttribute('data-issn');
                });
                sendJournalRequest(issns);
            }
            const entriesRequested = resTable.querySelectorAll('tr.entry[data-journal-requested]');
            if (journalInterval && (entriesRequested && entriesRequested.length >= ntotal || canceled)) {
                console.log('Clear serialInterval');
                clearInterval(journalInterval);
                journalInterval = undefined;
            }
        }
        
        function sendJournalRequest(issns) {
            if (issns.length==0) {
                console.error('sendJournalRequest: Trying to request 0 issns!');
                return;
            }
        
            let req = new XMLHttpRequest();
        
            req.onload = (evt) => { processJournalResponse(evt, req); }
            req.onerror = (evt) => { processJournalResponse(evt, req); }
            req.ontimeout = (evt) => { processJournalResponse(evt, req); }
            req.onabort = (evt) => { processJournalResponse(evt, req); }
        
            let url = `${serialUrl}?${issns.map((issn) => `issn=${issn}`).join('&')}&count=${issns.length}`;
        
            console.log(`Requesting ${issns.length} serial titles from Scopus by URL:\n${url}`)
            
            req.open('GET', url, true);
            for (let key in headers) req.setRequestHeader(key, headers[key]);
            req.responseType = 'json';
            req.send();
        
            searchRequests.push(req);
        }
        
        function updateJournalHashmap(journalEntries) {
            console.log(`Copying ${journalEntries.length} journals to journalMap`);
        
            journalEntries.forEach((entry) => {
                const copyEntry = JSON.parse(JSON.stringify(entry));
                if ('prism:issn' in entry) {
                    journalMap[entry['prism:issn'].replace('-', '')] = copyEntry;
                }
                if ('prism:eIssn' in entry) {
                    journalMap[entry['prism:eIssn'].replace('-', '')] = copyEntry;
                }
            });
        }
        
        function processJournalResponse(evt, req) {
            const json = req.response;
            let msg;
        
            if (evt.type == 'load' && req.status == 200 && 
                'serial-metadata-response' in json && 'entry' in json['serial-metadata-response']) {
                console.log(`Processing response for URL:\n${req.responseURL}`)
                updateJournalHashmap(json['serial-metadata-response']['entry']);
                fillJournalMetrics();
            } else {
                if (evt.type == 'abort')
                    msg = 'Load aborted';
                else if (evt.type == 'error')
                    msg = 'Load error';
                else if (evt.type == 'timeout')
                    msg = 'Timeout';
                else if (evt.type == 'load') {
                    msg = `HTTP status ${req.status}`;
                    if ('serial-metadata-response' in json && 'error' in json['serial-metadata-response'])
                        msg = json['serial-metadata-response']['error']
                } else 
                    msg = 'Unknown event';
                console.error('processJournalResponse: EVENT ' + evt.type + ': ' + msg + '\n     while requesting ' + req.responseURL);
            }
        }
        
        function fillJournalMetrics() {
            let entries = resTable.querySelectorAll('tr.entry[data-journal-requested]:not([data-metrics-filled])');
            console.log(`Filling journal metrics for ${entries.length} entries`);
            for (let entry of entries) {
                const issn = entry.getAttribute('data-issn');
        
                if (issn == '') {
                    entry.toggleAttribute('data-metrics-filled', true);
                    continue;
                }
                
                const journal = journalMap[issn];
        
                if (!journal) { // should not happen
                    console.warn(`Could not find journal metadata for ISSN ${issn}`);
        
                    if (issn in journalLoadTries) {
                        journalLoadTries[issn]++;
                    } else {
                        journalLoadTries[issn] = 0;
                    }
        
                    if (journalLoadTries[issn] < journalMaxLoadTries) {
                        console.log(`Requesting journal with ISSN ${issn} again`);
                        entry.toggleAttribute('data-journal-requested');
                    } else {
                        console.error(`Maximum journal load tries reached (${journalMaxLoadTries}) for ISSN ${issn}, give up`);
                    }
        
                    continue; 
                }
        
                entry.toggleAttribute('data-metrics-filled');
        
                if ('citeScoreYearInfoList' in journal) {
                    if (journalMetricYear === undefined)
                        fillJournalMetricsYear(journal.citeScoreYearInfoList.citeScoreCurrentMetricYear);
                    if (journalMetricYear == journal.citeScoreYearInfoList.citeScoreCurrentMetricYear)
                        entry.querySelector('td.citescore').innerHTML = journal.citeScoreYearInfoList.citeScoreCurrentMetric;
                }
        
                if ('SNIPList' in journal) {
                    let snips = journal.SNIPList.SNIP.filter((e) => e['@year'] == journalMetricYear).map((e) => e['$'])
                    if (snips.length > 0)
                        entry.querySelector('td.snip').innerHTML = snips[0]
                }
        
                if ('SJRList' in journal) {
                    let sjrs = journal.SJRList.SJR.filter((e) => e['@year'] == journalMetricYear).map((e) => e['$'])
                    if (sjrs.length > 0) 
                        entry.querySelector('td.sjr').innerHTML = sjrs[0]
                }
            }
        }
        
        // Main function to start the search
        function searchScopusPubs() {
            resTable = document.getElementById('restable');
            offset = 0;
            ntotal = undefined;
            nloaded = 0;
            stopped = false;
            canceled = false;
            searchRequests = [];
            searchInterval = undefined;
            journalMap = {};
            journalLoadTries = {};
            journalMetricYear = undefined;
        
            let progressElm = document.getElementById('progress');
            let resultElm = document.getElementById('result');
            showJustNumber = document.getElementById('justnumber').checked;
        
            resTable.innerHTML = progressElm.innerHTML = resultElm.innerHTML = '';
        
            const apikeyElm = document.getElementById('apikey');
            if (!apikeyrx.test(apikeyElm.value)) {
                apikeyElm.style.borderColor = "var(--error-color)";
                processError('Недействительный API-ключ ' + apikeyElm.value);
                return;
            }
        
            const searchQueryElm = document.getElementById('searchquery');
            if (searchQueryElm.value.includes('\r') || searchQueryElm.value.includes('\n'))
                searchQueryElm.value = searchQueryElm.value.replace(/[\r\n]/g, '');
            const searchQuery = encodeURIComponent(searchQueryElm.value.trim());
            if (searchQuery.length < 5) {
                searchQueryElm.style.borderColor = "var(--error-color)";
                processError('invalidQuery');
                return;
            }
        
            document.getElementById('search-button').disabled = true;
        
            let searchUrl = 'https://api.elsevier.com/content/search/scopus?query=' + searchQuery;
            headers = {'Accept': 'application/json', 'X-ELS-APIKey': apikeyElm.value};
        
            console.log('Requesting Scopus Search API URL:', searchUrl);
        
            sendSearchRequest(searchUrl, headers, (showJustNumber ? 1 : defcount));
        
            updateProgress();
        
            journalInterval = setInterval(loadJournalMetrics, 1.3*delay);
        }
    </script>
    <!-- Page code -->
    <script>
        function resetInvalid(elmid) {
            let elm;
            if (typeof(elmid) == 'object')
                elm = elmid;
            else if (typeof(elmid) == 'string')
                elm = document.getElementById(elmid);
            else
                return;
            elm.style['border-color'] = 'var(--theme-color)';
            return elm;
        }
        
        function resetApikey() {
            resetInvalid('apikey').value = '';
        }

        function resetSearch() {
            resetInvalid('searchquery').value = '';
        }

    </script>
</head>

<body>
    <label for="apikey" class="input-label">API-ключ Scopus:</label>
    <div class="input-div">
        <input type="text" id="apikey" class="input" placeholder="Введите API-ключ" onchange="resetInvalid(this)" onclick="resetInvalid(this)">
        <input type="button" class="reset-button clear-button" value="&times;" onclick="resetApikey()">
    </div>

    <label for="searchquery" class="input-label"><b>Строка поиска в Scopus:</b></label>
    <div class="input-div">
        <textarea id="searchquery" class="input" cols="50" rows="2" placeholder="Введите условие поиска" onchange="resetInvalid(this)" onclick="resetInvalid(this)"></textarea>
        <input type="button" class="reset-button clear-button" value="&times;" onclick="resetSearch()">
    </div>
    <p class="input-div"><a href="https://service.elsevier.com/app/answers/detail/a_id/11365/supporthub/scopus/kw/advanced+search/" target="_blank">Справка по полям поиска</a></p>
    <div class="input-div">
        <input type="checkbox" id="justnumber" value="off"><label for="justnumber">Получить только число публикаций</label>
    </div>
    <div class="input-div">
        <button type="button" id="search-button" onclick="searchScopusPubs()">
            Искать
        </button>
    </div>

    <div id="result" class="result-div"></div>
    <div id="progress" class="result-div"></div>
    <table id="restable"></table>
</body>

</html>
